name: URL health check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed service URL
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fullstack-part11.fly.dev/
          follow-redirect: true
          max-attempts: 3
          retry-delay: 5s
          